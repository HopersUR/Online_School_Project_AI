spring:
  application:
    name: Online_School_Project_AI
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:egeschool}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

openrouter:
  api:
    key: ${OPENROUTER_API_KEY}
